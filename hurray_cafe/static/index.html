<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hurray Cafe - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cafe-yellow': '#FFD700',
                        'cafe-dark': '#2D3748',
                        'cafe-light': '#F7FAFC'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Status Bar (Mobile) -->
    <div class="bg-black text-white text-xs px-4 py-1 flex justify-between items-center">
        <span>9:41</span>
        <div class="flex items-center space-x-1">
            <div class="w-4 h-2 bg-white rounded-sm"></div>
            <div class="w-6 h-3 border border-white rounded-sm flex items-center justify-center">
                <div class="w-4 h-1 bg-white rounded-sm"></div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-white shadow-sm px-4 py-3 flex items-center justify-between">
        <h1 class="text-xl font-bold text-cafe-dark">Welcome to Hurray Cafe</h1>
        <div class="flex items-center space-x-3">
            <button class="text-cafe-dark hover:text-cafe-yellow transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-5 5v-5z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 20h10a2 2 0 002-2V6a2 2 0 00-2-2H7a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
            </button>
            <div class="w-8 h-8 bg-cafe-dark rounded-full flex items-center justify-center text-white font-bold text-sm">
                HC
            </div>
        </div>
    </header>

    <!-- Banner -->
    <div class="bg-cafe-yellow mx-4 mt-4 rounded-lg p-6 text-center">
        <h2 class="text-2xl font-bold text-cafe-dark mb-2">Scan. Order. Enjoy.</h2>
        <p class="text-cafe-dark">Discover our delicious menu categories.</p>
    </div>

    <!-- Menu Categories -->
    <main class="px-4 py-6">
        <div class="grid grid-cols-2 gap-4" id="menu-categories">
            <!-- Categories will be loaded dynamically -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-cafe-dark text-white px-4 py-6 mt-auto">
        <div class="text-sm space-y-1">
            <p>2nd Floor, Badshahi Sai Square, Civil Line Road,</p>
            <p>Irrigation, Panna, Madhya Pradesh - 488001</p>
            <p>Phone: 8008978656</p>
            <p class="text-xs text-gray-400 mt-2">Designed by Fintness</p>
        </div>
    </footer>

    <!-- Modal for Category Details -->
    <div id="category-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg max-w-md w-full max-h-96 overflow-y-auto">
                <div class="p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 id="modal-title" class="text-xl font-bold text-cafe-dark"></h3>
                        <button id="close-modal" class="text-gray-500 hover:text-gray-700">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                    <div id="modal-content" class="space-y-4">
                        <!-- Content will be loaded dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
